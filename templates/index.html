<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checador de Asistencia</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Special+Elite&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Special Elite', 'Courier New', monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #2b1810;
            background-image:
                /* Vetas de madera oscura */
                repeating-linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.15) 0px,
                    rgba(0, 0, 0, 0.15) 2px,
                    transparent 2px,
                    transparent 6px,
                    rgba(0, 0, 0, 0.08) 6px,
                    rgba(0, 0, 0, 0.08) 8px,
                    transparent 8px,
                    transparent 14px
                ),
                repeating-linear-gradient(
                    90deg,
                    rgba(80, 40, 20, 0.3) 0px,
                    rgba(80, 40, 20, 0.3) 40px,
                    rgba(40, 20, 10, 0.3) 40px,
                    rgba(40, 20, 10, 0.3) 80px
                ),
                radial-gradient(ellipse at center, #4a2818 0%, #2b1810 70%, #1a0f08 100%);
        }
 
        /* Poste de barbero decorativo en las esquinas */
        body::before,
        body::after {
            content: '';
            position: fixed;
            top: 0;
            width: 25px;
            height: 100vh;
            background: repeating-linear-gradient(
                -45deg,
                #c41e3a 0px,
                #c41e3a 15px,
                #ffffff 15px,
                #ffffff 30px,
                #1e3a8a 30px,
                #1e3a8a 45px,
                #ffffff 45px,
                #ffffff 60px
            );
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            border-left: 3px solid #1a0a05;
            border-right: 3px solid #1a0a05;
            z-index: 1;
        }
 
        body::before { left: 0; }
        body::after { right: 0; }
 
        .tarjeta {
            background:
                radial-gradient(ellipse at top, rgba(255, 220, 150, 0.08) 0%, transparent 60%),
                linear-gradient(145deg, #f4e4c1 0%, #e8d4a8 50%, #d4b483 100%);
            padding: 50px 45px;
            border-radius: 8px;
            box-shadow:
                inset 0 0 0 2px #8b6f3a,
                inset 0 0 0 4px #f4e4c1,
                inset 0 0 0 6px #8b6f3a,
                0 0 0 8px #3d2817,
                0 0 0 12px #c9a35f,
                0 0 0 14px #3d2817,
                0 25px 50px rgba(0, 0, 0, 0.6),
                0 10px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 2;
        }
 
        /* Adorno superior - símbolo de barbería */
        .ornamento {
            font-family: 'Cinzel', serif;
            color: #8b4513;
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 8px;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.3);
        }
 
        .ornamento::before,
        .ornamento::after {
            content: '✦';
            color: #c9a35f;
            margin: 0 10px;
            font-size: 20px;
        }
 
        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            color: #3d2817;
            margin: 0 0 8px 0;
            font-size: 32px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow:
                2px 2px 0 #c9a35f,
                3px 3px 0 rgba(0, 0, 0, 0.2);
        }
 
        .subtitulo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #6b4423;
            font-size: 16px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
 
        .divisor {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #8b4513;
        }
 
        .divisor::before,
        .divisor::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b4513, transparent);
            max-width: 100px;
        }
 
        .divisor span {
            margin: 0 15px;
            font-size: 20px;
        }
 
        .instruccion {
            font-family: 'Special Elite', monospace;
            color: #4a2c17;
            font-size: 17px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
 
        .estado {
            background:
                repeating-linear-gradient(
                    45deg,
                    rgba(139, 69, 19, 0.05) 0px,
                    rgba(139, 69, 19, 0.05) 10px,
                    transparent 10px,
                    transparent 20px
                ),
                linear-gradient(135deg, #2b1810 0%, #4a2818 100%);
            color: #f4e4c1;
            padding: 25px 20px;
            border-radius: 4px;
            font-family: 'Special Elite', monospace;
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 3px double #c9a35f;
            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            position: relative;
        }
 
        .estado::before {
            content: '◆';
            color: #c9a35f;
            margin-right: 10px;
        }
 
        .estado::after {
            content: '◆';
            color: #c9a35f;
            margin-left: 10px;
        }
 
        .pie {
            margin-top: 25px;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #6b4423;
            font-size: 13px;
            letter-spacing: 2px;
        }
 
        .pie::before,
        .pie::after {
            content: '—';
            margin: 0 8px;
        }
 
        /* Animación sutil de espera */
        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
 
        #mensaje-estado {
            animation: parpadeo 2s ease-in-out infinite;
        }
 
        @media (max-width: 500px) {
            body::before,
            body::after {
                width: 15px;
            }
            .tarjeta {
                padding: 35px 25px;
            }
            h1 { font-size: 24px; }
            .ornamento { font-size: 24px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="ornamento">BARBER</div>
        <h1>Sistema de Chequeo</h1>
        <div class="subtitulo">Control de Asistencia</div>
        <div class="divisor"><span>✂</span></div>
        <p class="instruccion">Por favor, acerque su tarjeta RFID al lector</p>
        <div class="estado" id="mensaje-estado">
            Esperando tarjeta...
        </div>
        <div class="pie">Est. Barbería</div>
    </div>
</body>
</html>
